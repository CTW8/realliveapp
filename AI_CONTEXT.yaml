core_rules:
  status_semantics:
    online: green
    recording: orange
    offline: red
  dangerous_actions_require_confirm: true
  rule_constraints:
    name_length: "4-48"
    condition_min_len: 12
    actions_min_len: 8
    high_priority:
      quiet_hours: disabled_only
      enabled: true
      escalation_disallow: "After 180 seconds"

web_targets:
  suggested_stack:
    - React
    - TypeScript
    - Vite
    - React Router
    - TanStack Query
    - Zustand
  modules:
    - app-shell
    - dashboard-map
    - live-monitor
    - alert-center
    - rule-engine
    - playback
    - device-management
    - storage
    - settings

mobile_targets:
  suggested_stack:
    - Kotlin
    - Jetpack Compose
    - MVVM
    - Hilt
    - Retrofit
  modules:
    - auth
    - dashboard
    - live
    - playback
    - alerts
    - device-onboarding
    - settings

commands:
  preview:
    - "python3 -m http.server 8080"
    - "open http://localhost:8080/prototypes/mobile-app/index.html"
    - "open http://localhost:8080/prototypes/server-web/index.html"
